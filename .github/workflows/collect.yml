# 나라장터 공고 자동 수집 — cron-job.org가 멈췄을 때를 대비한 두 번째 경로
# 사이트의 '수동 수집' 버튼과 같은 창구(POST)를 두드리므로 따로 설정할 비밀값이 없다.
name: collect

on:
  schedule:
    # 깃허브는 */10 같은 잦은 주기를 그대로 지켜 주지 않는다(몇 시간씩 건너뜀).
    # 분을 흩어 적어 두면 그나마 자주 뜬다. 정확한 10분 간격은 cron-job.org 몫.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 공고 수집
        run: |
          code=$(curl -sS -X POST -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            "${{ vars.SITE_URL || 'https://g2b-sand.vercel.app' }}/api/collect")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"

      - name: 새 공고 미리 분석 (한 건씩, 최대 3건)
        continue-on-error: true   # 분석이 밀려도 수집은 이미 끝난 것이므로 실패로 보지 않는다
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -X POST -o /tmp/a.json -w '%{http_code}' --max-time 90 \
              "${{ vars.SITE_URL || 'https://g2b-sand.vercel.app' }}/api/analyze-pending")
            echo "[$i] HTTP $code"; cat /tmp/a.json; echo
            [ "$code" = "200" ] || break
            grep -q '"left":0' /tmp/a.json && { echo "남은 공고 없음"; break; }
          done
