# 나라장터 공고 자동 수집 — cron-job.org가 멈췄을 때를 대비한 두 번째 경로
# 사이트의 '수동 수집' 버튼과 같은 창구(POST)를 두드리므로 따로 설정할 비밀값이 없다.
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (깃허브 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:          # 저장소 Actions 탭에서 손으로도 실행 가능

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 수집 호출
        run: |
          code=$(curl -sS -X POST -o /tmp/out.json -w '%{http_code}' --max-time 150 \
            "${{ vars.SITE_URL || 'https://g2b-sand.vercel.app' }}/api/collect")
          echo "HTTP $code"; cat /tmp/out.json; echo
          # 504는 수집을 마친 뒤 '미리 분석'이 길어져 끊긴 경우 — 수집 자체는 기록되므로 실패로 보지 않는다
          case "$code" in
            200) echo "수집 완료" ;;
            504) echo "수집은 됐고 뒤이은 분석이 시간 초과로 끊김 (다음 회차에 이어서 함)" ;;
            *) echo "수집 실패"; exit 1 ;;
          esac
